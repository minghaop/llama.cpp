[package]
name = "tokenizers_capi"
version = "0.1.0"
edition = "2018"
description = "Rust implementation for C-wrappers in tokenizers-capi.h"

[lib]
crate-type = ["staticlib"]

[features]
default = ["mmap"]
mmap = ["memmap2"]

[dependencies]
tokenizers = { version = "0.20.0", default-features = false, features = ["onig"] }

memmap2 = { version = "=0.9.0", optional = true}
monostate = "=0.1.14"
monostate-impl =  "=0.1.14"

[profile.release]
lto = true
