# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Connection timeout and SSL settings to handle "SSL peer shut down incorrectly"
org.gradle.internal.http.socketTimeout=600000
org.gradle.internal.http.connectionTimeout=600000
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=600000
